# TEMPORARY validation (fix/ifx-build-multipass-hang branch) — removed before the PR is final.
# Proves the make_lib.sh fix makes the REAL ifx build complete (previously it hung the
# speculative multi-pass indefinitely). Builds release+OpenMP and debug, end to end, timed.
name: validate-ifx-build
on:
  push:
    branches: [fix/ifx-build-multipass-hang]
  workflow_dispatch:

jobs:
  ifx-real-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Intel oneAPI Fortran (ifx)
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-fortran make

      - name: Build library+engine with ifx (release + OpenMP), timed
        run: |
          source /opt/intel/oneapi/setvars.sh
          IFX="$(command -v ifx)"; "$IFX" --version | head -1
          make link-data
          echo "=== make FC=ifx BUILD_TYPE=release OPENMP=1 build-estas ==="
          t0=$(date +%s)
          make FC="$IFX" BUILD_TYPE=release OPENMP=1 build-estas
          echo "release+OpenMP build wall time: $(( $(date +%s)-t0 ))s"
          test -f SOURCE_CODE/build/libaquabc.a && echo "libaquabc.a OK" || { echo "libaquabc.a MISSING"; exit 1; }
          test -x ESTAS_II && echo "ESTAS_II OK" || { echo "ESTAS_II MISSING"; exit 1; }

      - name: Rebuild with ifx at -O0 (debug) — confirms -O0 no longer hangs either
        run: |
          source /opt/intel/oneapi/setvars.sh
          IFX="$(command -v ifx)"
          make clean-lib clean-model
          echo "=== make FC=ifx BUILD_TYPE=debug build-lib ==="
          t0=$(date +%s)
          make FC="$IFX" BUILD_TYPE=debug build-lib
          echo "debug (-O0) build wall time: $(( $(date +%s)-t0 ))s"
          test -f SOURCE_CODE/build/libaquabc.a && echo "debug libaquabc.a OK" || { echo "MISSING"; exit 1; }

      - name: Smoke-run the ifx-built engine (0D example)
        run: |
          source /opt/intel/oneapi/setvars.sh
          IFX="$(command -v ifx)"
          make clean-lib clean-model
          make FC="$IFX" BUILD_TYPE=release build-lib build-example
          make -C SOURCE_CODE/AQUABC/AQUABC_EXAMPLES/AQUABC_PELAGIC_0D run | tail -5
          test -f SOURCE_CODE/AQUABC/AQUABC_EXAMPLES/AQUABC_PELAGIC_0D/OUTPUT.csv && echo "0D OUTPUT.csv produced by ifx build OK"
