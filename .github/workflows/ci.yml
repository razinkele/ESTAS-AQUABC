name: CI

on:
  push:
  pull_request:

jobs:
  python-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install ruff==0.15.21 pytest pytest-cov
          pip install -r shiny_app/requirements.txt

      - name: Lint with ruff (shiny_app + tests)
        run: ruff check shiny_app/ tests/python/

      - name: Run Python tests
        run: pytest tests/python/ -v --cov=shiny_app --cov-report=term-missing --cov-report=xml

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install pytest playwright pytest-playwright
          pip install -r shiny_app/requirements.txt shinyswatch shinychat

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run Playwright integration tests
        run: python -m pytest tests/python/test_app_playwright.py -v --tb=short

  build-and-run:
    runs-on: ${{ matrix.os }}
    # Compiler/platform matrix. Currently gfortran-on-Ubuntu only; the structure
    # is here so adding a compiler or OS is a one-line matrix entry once verified.
    # fail-fast: false so one compiler's failure doesn't cancel the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            fc: gfortran
          - os: macos-latest
            fc: gfortran
          # Intel ifx is verified by the dedicated `build-intel` job below (it needs a
          # different install + `setvars.sh` sourcing, so it does not fit this matrix).
    name: build-and-run (${{ matrix.os }}, ${{ matrix.fc }})
    env:
      FC: ${{ matrix.fc }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # Ensure a bare `gfortran` exists on PATH so the whole toolchain behaves
          # exactly as on Linux with FC=gfortran. GitHub's macOS runners ship
          # gfortran only as a versioned binary (e.g. gfortran-14), and the 0D
          # example Makefile hardcodes `gfortran`, so if there's no bare `gfortran`
          # we symlink the newest gfortran-<ver> into Homebrew's bin (on PATH).
          # NOTE: macOS ships BSD sort (no `-V`); pick the newest with a portable
          # numeric sort on the version field.
          if ! command -v gfortran >/dev/null 2>&1; then
            brew list gcc >/dev/null 2>&1 || brew install gcc
            GF=$(ls "$(brew --prefix)"/bin/gfortran-* 2>/dev/null \
                  | sed 's:.*/::' | sort -t- -k2 -n | tail -1)
            [ -n "$GF" ] || { echo "ERROR: no gfortran-<ver> found after brew install gcc"; exit 1; }
            ln -sf "$(command -v "$GF")" "$(brew --prefix)/bin/gfortran"
          fi
          command -v gfortran >/dev/null 2>&1 || { echo "ERROR: gfortran not on PATH"; exit 1; }
          gfortran --version | head -1

      - name: Link data (repo-root convenience)
        run: make link-data

      - name: Build library
        run: make build-lib

      - name: Build example
        run: make build-example

      - name: Run example and capture log
        run: |
          mkdir -p OUTPUTS
          make run-example | tee run.log

      - name: Run example tests
        run: make -C SOURCE_CODE/AQUABC/AQUABC_EXAMPLES/AQUABC_PELAGIC_0D test

      - name: End-to-end regression (0D output vs golden)
        # Runs the 0D example and diffs OUTPUT.csv against the committed golden.
        # The header/structure check (column count/name/order, row count) is exact
        # on every platform. The golden is gfortran-on-Ubuntu-x86 generated, so on
        # macOS (ARM64, different libm) the *numeric* check is demoted to a warning
        # via --numeric-warn while the structural check stays fatal.
        run: |
          make -C SOURCE_CODE/AQUABC/AQUABC_EXAMPLES/AQUABC_PELAGIC_0D run
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="--numeric-warn"; fi
          python3 tests/regression/compare_0D.py \
            SOURCE_CODE/AQUABC/AQUABC_EXAMPLES/AQUABC_PELAGIC_0D/OUTPUT.csv \
            tests/regression/pelagic_0D_golden.csv --rtol 1e-6 --atol 1e-9 $EXTRA

      - name: Run Fortran unit tests
        run: make -C tests/fortran clean test

      - name: Install ftnchek
        if: runner.os == 'Linux'   # ftnchek is apt-only; Linux static-analysis
        run: |
          sudo apt-get update
          sudo apt-get install -y ftnchek

      - name: Run ftnchek (Fortran static checks)
        if: runner.os == 'Linux'
        run: |
          # Run ftnchek across all Fortran sources, save full output to a report
          find SOURCE_CODE -name "*.f90" -print0 | xargs -0 ftnchek -usage -truncation -f90 -portability -pretty -columns=132 > ftnchek_report.txt 2>&1 || true

      - name: Summarize ftnchek results
        if: runner.os == 'Linux'
        run: |
          echo "--- ftnchek report summary (first 40 matches of 'Error near line') ---"
          grep -n "Error near line" ftnchek_report.txt | head -n 40 || true
          echo "--- tail of report (last 20 lines) ---"
          tail -n 20 ftnchek_report.txt || true

      - name: Upload ftnchek report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ftnchek-report
          path: ftnchek_report.txt

      - name: Filter ftnchek and fail on unexpected lines
        if: runner.os == 'Linux'
        run: |
          bash tools/filter_ftnchek.sh ftnchek_report.txt > tools/ftnchek_unexpected.txt
          # If unexpected lines exist, print them and fail the job
          if ! grep -q "No unexpected ftnchek lines found. Clean." tools/ftnchek_unexpected.txt; then
            echo "Unexpected ftnchek output detected:"; sed -n '1,200p' tools/ftnchek_unexpected.txt; exit 1
          fi

      - name: Upload filtered ftnchek output
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ftnchek-unexpected
          path: tools/ftnchek_unexpected.txt

      - name: Check simulation finished
        run: grep -q "simulation finished" run.log

  # Intel oneAPI Fortran (ifx) build. Intel oneAPI is free (no license) and installs from
  # Intel's apt repo on a stock ubuntu-latest runner — no special hardware. This verifies
  # the code and the Intel `-fp-model precise` / `-heap-arrays` flags compile and link with
  # ifx, serial and with OpenMP. Build-only: the 0D example Makefile hardcodes gfortran, so
  # the ifx path builds the library + ESTAS engine (which respect FC); a run-smoke could be
  # added once an ifx-buildable small config lands in the checkout.
  build-intel:
    runs-on: ubuntu-latest
    name: build-intel (ifx, oneAPI)
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Intel oneAPI Fortran (ifx)
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-fortran make

      - name: Build library + ESTAS with ifx (serial + OpenMP)
        run: |
          source /opt/intel/oneapi/setvars.sh
          set -e
          IFX="$(command -v ifx)"     # full path so the Makefile's IFX_LIB_PATH resolves
          "$IFX" --version | head -1
          echo "== serial release build (verifies -fp-model precise) =="
          make FC="$IFX" build-estas
          echo "== OpenMP build (verifies -qopenmp -heap-arrays) =="
          make FC="$IFX" clean-all
          make FC="$IFX" OPENMP=1 build-estas
