name: CI

on:
  push:
  pull_request:

jobs:
  python-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install ruff==0.15.21 pytest pytest-cov
          pip install -r shiny_app/requirements.txt

      - name: Lint with ruff (shiny_app + tests)
        run: ruff check shiny_app/ tests/python/

      - name: Run Python tests
        run: pytest tests/python/ -v --cov=shiny_app --cov-report=term-missing --cov-report=xml

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install pytest playwright pytest-playwright
          pip install -r shiny_app/requirements.txt shinyswatch shinychat

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      # The tutorial suite drives the app's own Run Model / Quick Run path, which
      # spawns ./ESTAS_II. Without the binary that test skips, so build it here --
      # it is the only CI coverage of the app-to-model boundary (a broken Quick Run
      # button shipped undetected while this suite ran nowhere).
      - name: Install Fortran toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make

      - name: Build ESTAS_II (for the tutorial Quick Run test)
        run: |
          make build-estas
          # OUTPUTS_30day/ is gitignored, so a fresh checkout does not have it and
          # the model cannot create it -- the run would fail on its first write.
          mkdir -p OUTPUTS_30day

      - name: Run Playwright integration tests
        run: |
          python -m pytest tests/python/test_app_playwright.py \
                           tests/python/test_tutorial_playwright.py -v --tb=short

  build-and-run:
    runs-on: ${{ matrix.os }}
    # Compiler/platform matrix. Currently gfortran-on-Ubuntu only; the structure
    # is here so adding a compiler or OS is a one-line matrix entry once verified.
    # fail-fast: false so one compiler's failure doesn't cancel the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            fc: gfortran
          - os: macos-latest
            fc: gfortran
          # Intel ifx is verified by the dedicated `build-intel` job below (it needs a
          # different install + `setvars.sh` sourcing, so it does not fit this matrix).
    name: build-and-run (${{ matrix.os }}, ${{ matrix.fc }})
    env:
      FC: ${{ matrix.fc }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # Ensure a bare `gfortran` exists on PATH so the whole toolchain behaves
          # exactly as on Linux with FC=gfortran. GitHub's macOS runners ship
          # gfortran only as a versioned binary (e.g. gfortran-14), and the 0D
          # example Makefile hardcodes `gfortran`, so if there's no bare `gfortran`
          # we symlink the newest gfortran-<ver> into Homebrew's bin (on PATH).
          # NOTE: macOS ships BSD sort (no `-V`); pick the newest with a portable
          # numeric sort on the version field.
          if ! command -v gfortran >/dev/null 2>&1; then
            brew list gcc >/dev/null 2>&1 || brew install gcc
            GF=$(ls "$(brew --prefix)"/bin/gfortran-* 2>/dev/null \
                  | sed 's:.*/::' | sort -t- -k2 -n | tail -1)
            [ -n "$GF" ] || { echo "ERROR: no gfortran-<ver> found after brew install gcc"; exit 1; }
            ln -sf "$(command -v "$GF")" "$(brew --prefix)/bin/gfortran"
          fi
          command -v gfortran >/dev/null 2>&1 || { echo "ERROR: gfortran not on PATH"; exit 1; }
          gfortran --version | head -1

      - name: Link data (repo-root convenience)
        run: make link-data

      - name: Build library
        run: make build-lib

      - name: Build example
        run: make build-example

      - name: Run example and capture log
        run: |
          mkdir -p OUTPUTS
          make run-example | tee run.log

      - name: Fail-loud constants reader check
        # Doctors temp copies of WCONST_04.txt and asserts READ_MODEL_CONSTANTS aborts (nonzero exit,
        # named index) on a dropped/out-of-range/duplicate constant, and that AQUABC_LENIENT_CONSTANTS=1
        # warns without aborting. Linux-only (uses `timeout`); the reader is platform-independent.
        # Runs WITHOUT AQUABC_LENIENT_CONSTANTS so the strict default path is exercised.
        if: runner.os == 'Linux'
        run: bash tests/integration/fail_loud_constants.sh

      - name: Run example tests
        run: make -C SOURCE_CODE/AQUABC/AQUABC_EXAMPLES/AQUABC_PELAGIC_0D test

      - name: End-to-end regression (0D output vs golden)
        # Runs the 0D example and diffs OUTPUT.csv against the committed golden.
        # The header/structure check (column count/name/order, row count) is exact
        # on every platform. The golden is gfortran-on-Ubuntu-x86 generated, so on
        # macOS (ARM64, different libm) the *numeric* check is demoted to a warning
        # via --numeric-warn while the structural check stays fatal.
        run: |
          make -C SOURCE_CODE/AQUABC/AQUABC_EXAMPLES/AQUABC_PELAGIC_0D run
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="--numeric-warn"; fi
          python3 tests/regression/compare_0D.py \
            SOURCE_CODE/AQUABC/AQUABC_EXAMPLES/AQUABC_PELAGIC_0D/OUTPUT.csv \
            tests/regression/pelagic_0D_golden.csv --rtol 1e-6 --atol 1e-9 $EXTRA

      - name: Run Fortran unit tests
        run: make -C tests/fortran clean test

      - name: Install ftnchek
        if: runner.os == 'Linux'   # ftnchek is apt-only; Linux static-analysis
        run: |
          sudo apt-get update
          sudo apt-get install -y ftnchek

      - name: Run ftnchek (Fortran static checks)
        if: runner.os == 'Linux'
        run: |
          # Run ftnchek across all Fortran sources, save full output to a report
          find SOURCE_CODE -name "*.f90" -print0 | xargs -0 ftnchek -usage -truncation -f90 -portability -pretty -columns=132 > ftnchek_report.txt 2>&1 || true

      - name: Summarize ftnchek results
        if: runner.os == 'Linux'
        run: |
          echo "--- ftnchek report summary (first 40 matches of 'Error near line') ---"
          grep -n "Error near line" ftnchek_report.txt | head -n 40 || true
          echo "--- tail of report (last 20 lines) ---"
          tail -n 20 ftnchek_report.txt || true

      - name: Upload ftnchek report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ftnchek-report
          path: ftnchek_report.txt

      - name: Filter ftnchek and fail on unexpected lines
        if: runner.os == 'Linux'
        run: |
          bash tools/filter_ftnchek.sh ftnchek_report.txt > tools/ftnchek_unexpected.txt
          # If unexpected lines exist, print them and fail the job
          if ! grep -q "No unexpected ftnchek lines found. Clean." tools/ftnchek_unexpected.txt; then
            echo "Unexpected ftnchek output detected:"; sed -n '1,200p' tools/ftnchek_unexpected.txt; exit 1
          fi

      - name: Upload filtered ftnchek output
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ftnchek-unexpected
          path: tools/ftnchek_unexpected.txt

      - name: Check simulation finished
        run: grep -q "simulation finished" run.log

  # Intel oneAPI Fortran (ifx) full build. Intel oneAPI is free (no license) and installs
  # from Intel's apt repo on a stock ubuntu-latest runner — no special hardware. Builds the
  # whole AQUABC library + ESTAS_II engine with ifx at release+OpenMP (~1 min) and the
  # library at debug -O0 (~20 s). Earlier this hung indefinitely; the cause was make_lib.sh's
  # speculative multi-pass compiling leaf sources before their modules exist, which makes
  # ifx's front end hang (gfortran errors instantly). Fixed by compiling modules before leaf
  # files (SOURCE_CODE/build/make_lib.sh) plus a per-file Intel compile timeout.
  build-intel:
    runs-on: ubuntu-latest
    name: build-intel (ifx full build, oneAPI)
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Intel oneAPI Fortran (ifx)
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-fortran make

      - name: Build library + engine with ifx (release + OpenMP)
        run: |
          source /opt/intel/oneapi/setvars.sh
          set -eo pipefail
          IFX="$(command -v ifx)"
          "$IFX" --version | head -1
          # Assert the Makefile wires -fp-model precise into the ifx release flags:
          make FC="$IFX" BUILD_TYPE=release show-config | grep -- '-fp-model precise'
          make link-data
          make FC="$IFX" BUILD_TYPE=release OPENMP=1 build-estas
          test -f SOURCE_CODE/build/libaquabc.a || { echo "libaquabc.a MISSING"; exit 1; }
          test -x ESTAS_II                       || { echo "ESTAS_II MISSING"; exit 1; }
          echo "ifx release+OpenMP build OK"

      - name: Build library with ifx at -O0 (debug)
        run: |
          source /opt/intel/oneapi/setvars.sh
          set -eo pipefail
          IFX="$(command -v ifx)"
          make FC="$IFX" clean-lib clean-model
          make FC="$IFX" BUILD_TYPE=debug build-lib
          test -f SOURCE_CODE/build/libaquabc.a || { echo "debug libaquabc.a MISSING"; exit 1; }
          echo "ifx debug (-O0) build OK"

  docker-build:
    name: Reproducible container build + self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the reproducible container (runs the 0D golden self-test at build time)
        run: docker build -t aquabc:ci .
      - name: Run the container self-test
        run: docker run --rm aquabc:ci
